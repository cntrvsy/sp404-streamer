# Bacon configuration for SP-404 Streamer
# See https://dystroy.org/bacon/

default_job = "clippy"

[jobs.check]
command = ["cargo", "check", "--color", "always"]
need_stdout = false

[jobs.clippy]
command = ["cargo", "clippy", "--all-targets", "--color", "always"]
need_stdout = false

[jobs.test]
command = ["cargo", "test", "--color", "always", "--", "--nocapture"]
need_stdout = true
