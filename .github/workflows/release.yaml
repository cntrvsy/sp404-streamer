name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release AppImage
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on main branch
        run: |
          git fetch origin main:main
          if ! git merge-base --is-ancestor HEAD main; then
            echo "Error: Current tagged commit is not reachable from the 'main' branch."
            echo "Releases are strictly restricted to tags pushed to 'main'."
            exit 1
          fi
          echo "Tagged commit verified on main branch."

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libclang-dev \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            librsvg2-bin \
            curl \
            file

      - name: Package AppImage
        run: |
          bash packaging/build_appimage.sh

      - name: Generate SHA256 checksum
        run: |
          cd target/release-appimage
          sha256sum sp404-streamer-x86_64.AppImage > sp404-streamer-x86_64.AppImage.sha256
          cat sp404-streamer-x86_64.AppImage.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release-appimage/sp404-streamer-x86_64.AppImage
            target/release-appimage/sp404-streamer-x86_64.AppImage.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
